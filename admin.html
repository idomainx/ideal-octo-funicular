<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>iDomainX Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/public/app.css">
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginView" class="hidden" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">
  <div style="width:100%;max-width:360px">
    <div style="font-weight:800;font-size:20px;letter-spacing:-0.02em;margin-bottom:20px">iDomainX</div>
    <form id="loginForm" class="card card-pad">
      <div class="form-field">
        <label class="form-label" for="loginPassword">Password</label>
        <input type="password" id="loginPassword" class="input" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="appView" class="hidden">
  <div class="app-shell">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo" id="sidebarLogo">iDomainX</div>
      <nav style="flex:1;overflow-y:auto">
        <div class="nav-item" data-route="dashboard" onclick="navigate('dashboard')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          Dashboard
        </div>
        <div class="nav-group-label">Site</div>
        <div class="nav-item" data-route="pages" onclick="navigate('pages')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Pages
        </div>
        <div class="nav-item" data-route="content" onclick="navigate('content')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
          Content
        </div>
        <div class="nav-item" data-route="templates" onclick="navigate('templates')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
          Templates
        </div>
        <div class="nav-item" data-route="media" onclick="navigate('media')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          Media
        </div>
        <div class="nav-group-label">Site</div>
        <div class="nav-item" data-route="publish" onclick="navigate('publish')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h16"/><path d="M4 15h16"/><path d="M10 3 8 21"/><path d="M16 3l-2 18"/></svg>
          Publish <span class="nav-badge hidden" id="publishBadge">0</span>
        </div>
        <div class="nav-item" data-route="backups" onclick="navigate('backups')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Backups
        </div>
        <div class="nav-item" data-route="settings" onclick="navigate('settings')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </div>
      </nav>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <button class="btn btn-ghost btn-sm mobile-menu-btn" onclick="toggleSidebar()" aria-label="Menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="topbar-breadcrumb" id="breadcrumb">Dashboard</div>
        <div class="topbar-right">
          <button class="btn btn-primary btn-sm" onclick="navigate('publish')">
            Publish <span class="badge badge-grey hidden" id="topbarPublishBadge" style="background:var(--bg);color:var(--ink)">0</span>
          </button>
          <button class="user-menu-btn" onclick="toggleUserMenu()" id="userMenuBtn" aria-label="User menu">A</button>
        </div>
      </header>
      <main class="view-container" id="viewContainer"></main>
    </div>
  </div>
</div>

<!-- ============ FULL-SCREEN EDITOR (z-index 60) ============ -->
<div id="editorOverlay" class="editor-overlay hidden">
  <div class="editor-topbar">
    <button class="btn btn-ghost btn-sm" onclick="closeEditor()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      Back
    </button>
    <input type="text" id="editorTitleInput" class="editor-title-input" placeholder="Page title">
    <span class="editor-save-indicator hidden" id="editorSaveIndicator"></span>
    <button class="btn btn-ghost btn-sm" onclick="openPreviewTab()">Open preview</button>
    <button class="btn btn-secondary btn-sm" onclick="copyPreviewLink()">Copy link</button>
  </div>
  <div class="editor-split">
    <div class="editor-left">
      <div id="editorAccordion"></div>
    </div>
    <div class="editor-right">
      <iframe id="previewFrame" class="preview-frame" title="Preview"></iframe>
    </div>
  </div>
</div>

<!-- ============ ONE LAYERED ROOT for modals / dialogs / toasts (D) ============ -->
<div id="modalRoot"></div>
<div class="toast-root" id="toastRoot" aria-live="polite"></div>

<script src="/public/app.js"></script>
</body>
</html>
